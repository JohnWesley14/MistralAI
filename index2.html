<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com Mistral (Ollama + LLPhant)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        #chat-box {
            border: 1px solid #ccc;
            padding: 20px;
            min-height: 200px;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        input[type="text"] {
            width: calc(100% - 100px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:disabled {
            background: #ccc;
        }
    </style>
</head>

<body>

    <h2>Converse com o Mistral</h2>

    <div id="chat-box"></div>

    <div style="display: flex; gap: 10px;">
        <input type="text" id="prompt" placeholder="Digite sua pergunta..." onkeypress="handleEnter(event)">
        <button id="send-btn" onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        // Permite enviar apertando "Enter"
        function handleEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('prompt');
            const chatBox = document.getElementById('chat-box');
            const sendBtn = document.getElementById('send-btn');

            const prompt = inputField.value.trim();
            if (!prompt) return;

            inputField.value = '';
            inputField.disabled = true;
            sendBtn.disabled = true;

            chatBox.innerHTML += `<b>Você:</b> ${prompt}\n<b>Mistral:</b> `;

            const responseSpan = document.createElement('span');
            chatBox.appendChild(responseSpan);

            try {
                const response = await fetch('stream.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                let messageQueue = "";
                let isFinished = false;

                // Frequência adaptativa: esvazia a fila de forma constante
                const typingInterval = setInterval(() => {
                    if (messageQueue.length > 0) {
                        // Se a fila acumulou muito texto, imprime mais caracteres por ciclo
                        let charsToTake = 1;
                        if (messageQueue.length > 30) charsToTake = 4;
                        else if (messageQueue.length > 10) charsToTake = 2;

                        responseSpan.textContent += messageQueue.slice(0, charsToTake);
                        messageQueue = messageQueue.slice(charsToTake);
                        chatBox.scrollTop = chatBox.scrollHeight;
                    } else if (isFinished) {
                        clearInterval(typingInterval);
                        chatBox.innerHTML += '\n\n';
                        inputField.disabled = false;
                        sendBtn.disabled = false;
                        inputField.focus();
                    }
                }, 12); // Executa a cada 12ms

                let buffer = "";
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) {
                        isFinished = true;
                        break;
                    }

                    buffer += decoder.decode(value, { stream: true });

                    // Decodifica as linhas no formato 'data: "texto"' do SSE
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop(); // Guarda pedaços incompletos de dados

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            try {
                                const parsed = JSON.parse(line.replace("data: ", ""));
                                messageQueue += parsed;
                            } catch (e) {
                                // Ignora falhas pontuais de parse de pacotes incompletos
                            }
                        }
                    }
                }

            } catch (error) {
                chatBox.innerHTML += `<span style="color: red;">Erro na requisição.</span>\n\n`;
                console.error(error);
                inputField.disabled = false;
                sendBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
