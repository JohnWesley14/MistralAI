<form>
<fieldset style="background-color:#f2f2f2; padding:20px; border-radius:5px;">
<legend style="color:#444; font-size:20px;">Contato</legend>
<label for="nome" style="display:block; margin-bottom:5px;">Nome:</label>
<input type="text" id="nome" name="nome" style="width:100%; padding:5px; border-radius:3px; border:1px solid #ccc; margin-bottom:10px;">

<label for="email" style="display:block; margin-bottom:5px;">Email:</label>
<input type="email" id="email" name="email" style="width:100%; padding:5px; border-radius:3px; border:1px solid #ccc; margin-bottom:10px;">

<label for="telefone" style="display:block; margin-bottom:5px;">Telefone:</label>
<input type="tel" id="telefone" name="telefone" style="width:100%; padding:5px; border-radius:3px; border:1px solid #ccc; margin-bottom:10px;">

<button type="button" onclick="mostrarValores()" style="background-color:#4CAF50; color:white; padding:5px 10px; border:none; border-radius:3px; cursor:pointer;">Mostrar valores</button>
</fieldset>
</form>

<div id="valores" style="margin-top:20px;"></div>

<script>
function mostrarValores() {
const nome = document.getElementById("nome").value;
const email = document.getElementById("email").value;
const telefone = document.getElementById("telefone").value;

const valores = document.getElementById("valores");
valores.innerHTML = `Nome: ${nome}<br>Email: ${email}<br>Telefone: ${telefone}`;
}
</script>
